[ui]

# Optional UI note: any widget section that already uses background_style/background_substyle
# can also define background_color = "" to override it with a flat color.


[ui.features]
refresh_interval = 10
mark_online_player_records = true
illuminate_names = true
sort_team = true
number_format = "english"
shorten_numbers = false

[ui.features.karma]
