[apps_manager.updates]
# Checks are opt-in. Copying files requires confirmation; restarting is manual.
enabled = false
channel = "stable"
# Exact same signed catalogue published on independent GitHub and website URLs.
github_manifest = ""
validation_manifest = ""
# Base64 of the 32-byte Ed25519 public key, provided locally by the publisher.
# Never put the private signing key here, on GitHub, or on the website.
public_key = ""
check_interval_seconds = 3600
notice_interval_seconds = 1800
