[apps_manager.updates]
# Checks are opt-in. Copying files requires confirmation; restarting is manual.
enabled = false
channel = "stable"
# Same catalogue, ZIP and SHA-256 file published independently on both hosts.
verification = "sha256"
github_manifest = "https://github.com/nilakite2/PyXaseco/releases/latest/download/catalogue.json"
validation_manifest = "https://tmtrialgy.com/api/pyxaseco/updates/stable.json"
check_interval_seconds = 3600
notice_interval_seconds = 1800
